# Serves the built app and forwards /api to app-api on the private Compose network.
# Cloudflare Access sits in front: its Cf-Access-Jwt-Assertion header and CF_Authorization cookie
# pass through unchanged, and app-api verifies them.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    proxy_pass http://app-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
    add_header Cache-Control no-store always;
  }

  # The shell and the service worker must be revalidated so a new deployment is picked up.
  location = /index.html { add_header Cache-Control no-cache always; }
  location = /sw.js { add_header Cache-Control no-cache always; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
