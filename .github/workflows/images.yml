# Builds the web app and app-api images and pushes them to GitHub's container registry (ghcr.io), where
# the Coolify server pulls them (see docs/deploy-coolify.md). Tags: the branch name (slashes become dashes)
# and sha-<commit>; pin the sha tag in Coolify for a deployment you can roll back to.
name: Container images

on:
  push:
    branches: [main, feature/gateway-integration]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ppd-web
            dockerfile: Dockerfile.web
          - image: ppd-app-api
            dockerfile: server/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        # ghcr.io needs a lowercase owner (MBA009 -> mba009).
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
